---
- OASValidation:
    .continueOnError: false
    .enabled: true
    .name: OAS-Validate
    DisplayName: OAS-Validate
    Source: request
    OASResource: oas://spec.yaml
- RaiseFault:
    .continueOnError: false
    .enabled: true
    .name: RF-CatchAll
    DisplayName: RF-CatchAll
    FaultResponse:
      Set:
        Payload:
          .contentType: application/json
          -Data: |-
            {
               "status": 404
               "error": "NotFound"
               "message": "resource not found"
            }
        StatusCode: 404
        ReasonPhrase: Not found
    IgnoreUnresolvedVariables: true
- MessageLogging:
    .name: ML-Logging-OK
    Syslog:
      Message: '[3f509b58 tag="{organization.name}.{apiproxy.name}.{environment.name}"]'
      Host: example.loggly.com
      Port: 514
      Protocol: TCP
      FormatMessage: true
      DateFormat: yyMMdd-HH:mm:ss.SSS
    logLevel: ALERT
- CORS:
    .continueOnError: false
    .enabled: true
    .name: CORS-VerifyOrigin
    DisplayName: CORS-VerifyOrigin
    AllowOrigins: '{request.header.origin}'
    AllowMethods: GET, PUT, POST, DELETE
    AllowHeaders: origin, x-requested-with, accept, content-type, apikey
    ExposeHeaders: Accept, Content-Type, Authorization
    MaxAge: 3628800
    AllowCredentials: true
    GeneratePreflightResponse: true
    IgnoreUnresolvedVariables: true
- FlowCallout:
    .async: false
    .continueOnError: false
    .enabled: false
    .name: FC-Security
    DisplayName: FC-Security
    FaultRules: {}
    Properties: {}
    SharedFlowBundle: SF-Security-v1
- FlowCallout:
    .async: false
    .continueOnError: false
    .enabled: true
    .name: FC-FaultHandling
    DisplayName: FC-FaultHandling
    FaultRules: {}
    Properties: {}
    SharedFlowBundle: SF-FaultHandler-v1